name: Release scripts

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    # Packages the scripts folder and publishes it as a GitHub release when you push a tag like v1.2.0.
    uses: MSPGC-Demo/.github/.github/workflows/reusable-script-release.yml@main
    with:
      path: scripts
